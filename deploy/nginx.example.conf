# Exemple nginx : reverse proxy vers les APIs locales.
# Copier vers /etc/nginx/sites-available/ et adapter server_name + certificats SSL.

server {
    listen 443 ssl;
    server_name your-domain.example;

    # ssl_certificate /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

    location = /vinted-api { return 301 /vinted-api/; }
    location /vinted-api/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /vinted-api;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location = /leboncoin-api { return 301 /leboncoin-api/; }
    location /leboncoin-api/ {
        proxy_pass http://127.0.0.1:8092/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /leboncoin-api;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location = /ecoledirecte-api { return 301 /ecoledirecte-api/; }
    location /ecoledirecte-api/ {
        proxy_pass http://127.0.0.1:8093/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /ecoledirecte-api;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location = /centrale-api { return 301 /centrale-api/; }
    location /centrale-api/ {
        proxy_pass http://127.0.0.1:8094/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /centrale-api;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}
